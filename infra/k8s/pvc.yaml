apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clouddeck-storage
  namespace: clouddeck
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clouddeck-workspaces
  namespace: clouddeck
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi
