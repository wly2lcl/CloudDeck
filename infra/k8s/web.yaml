apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: clouddeck
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          # 该镜像需以 NEXT_PUBLIC_API_BASE=https://api.clouddeck.example.com 构建
          image: ghcr.io/wly2lcl/clouddeck/web:0.1.2
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: clouddeck
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
