# 不要提交真实值；使用 kubectl create secret 或 External Secrets 注入。
apiVersion: v1
kind: Secret
metadata:
  name: clouddeck-secrets
  namespace: clouddeck
type: Opaque
stringData:
  DATABASE_URL: postgres://clouddeck:change-me@postgres.example.com:5432/clouddeck
  AUTH_SECRET: change-me-auth-secret
  CREDENTIALS_KEY: change-me-credentials-key
  STORAGE_LOCAL_SECRET: change-me-storage-secret
  PAYMENT_SECRET: change-me-payment-secret
  S3_ENDPOINT: https://s3.example.com
  S3_REGION: us-east-1
  S3_BUCKET: clouddeck
  S3_ACCESS_KEY: change-me
  S3_SECRET_KEY: change-me
  SILICONFLOW_API_KEY: change-me
