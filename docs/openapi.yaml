components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Ok:
      description: Success envelope
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              data: {}
              requestId: { type: string }
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            required: [error, requestId]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum:
                      - UNAUTHENTICATED
                      - FORBIDDEN
                      - NOT_FOUND
                      - VALIDATION_FAILED
                      - QUOTA_EXCEEDED
                      - BUDGET_EXCEEDED
                      - CAPABILITY_UNAVAILABLE
                      - DRIVER_ERROR
                      - RATE_LIMITED
                      - INTERNAL
                  message: { type: string }
                  details: {}
              requestId: { type: string }
