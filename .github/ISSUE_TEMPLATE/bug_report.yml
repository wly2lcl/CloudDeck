name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. For security issues, use the private advisory link in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 / commit sha
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - control plane / API
        - job runner / queue
        - capability (which one?)
        - web client
        - mobile client
        - deployment / Docker
        - docs
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before pasting.
      render: shell
