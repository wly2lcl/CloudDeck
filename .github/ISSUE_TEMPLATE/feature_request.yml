name: Feature request
description: Suggest a capability, driver, or platform improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want. If it is a capability, list inputs, outputs, and the intended driver.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This can be implemented as a capability package without changing the platform.
        - label: This requires a new driver or contract change.
