id: audiobook.render
version: 1.0.0
name: 有声小说生成
description: 按章节与角色合成多角色有声书，支持断点续作
category: audio
icon: audio-lines
inputs:
  - name: manuscript
    label: 稿件
    assetTypes: [novel_manuscript, script]
    required: true
outputs:
  - name: audio
    assetType: audio_track
    multiple: true
execution:
  mode: async
  resumable: true
  maxDurationMs: 21600000
  maxCostUsd: 5
  concurrency: 4
credentials:
  policy: tenant
driver:
  kind: pipeline
  ref: workers/tts
  routing:
    - driver: workers/tts
permissions:
  network: [dashscope.aliyuncs.com, localhost]
  filesystem: workspace-only
  secrets: [DASHSCOPE_API_KEY]
  allowShell: false
resources:
  cpu: 2
  memory: 2Gi
  gpu: optional
billing:
  unit: per_1k_chars
  priceKey: audiobook_tts
  estimate: 0.002
ui:
  form: ui/form.json
  result: audio_player
tags: [有声, 批量]
