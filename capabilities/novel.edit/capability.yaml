id: novel.edit
version: 1.0.0
name: 小说编辑协助
description: 续写、改写与一致性检查，由 Claude Code 在沙箱中执行
category: writing
icon: pen-line
inputs:
  - name: manuscript
    label: 稿件
    assetTypes: [novel_manuscript]
    required: true
  - name: storyBible
    label: 设定库
    assetTypes: [story_bible]
    required: false
outputs:
  - name: manuscript
    assetType: novel_manuscript
execution:
  mode: async
  resumable: false
  maxDurationMs: 1800000
  maxCostUsd: 3
  concurrency: 1
credentials:
  policy: tenant
driver:
  kind: agent-cli
  ref: drivers/claude-code
  routing:
    - driver: drivers/claude-code
permissions:
  network: [api.anthropic.com]
  filesystem: workspace-only
  secrets: [ANTHROPIC_API_KEY]
  allowShell: true
resources:
  cpu: 2
  memory: 2Gi
billing:
  unit: per_token
  priceKey: novel_edit
  estimate: 0.5
ui:
  form: ui/form.json
  result: text
prompts:
  system: prompts/novel-edit.md
tags: [写作, 小说]
